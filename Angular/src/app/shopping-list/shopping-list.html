<section class="exercise" aria-labelledby="shopping-list-title">
  <h2 id="shopping-list-title">3.2 Список покупок</h2>
  <div class="add-row">
    <input
      #itemInput
      type="text"
      placeholder="Что купить?"
      aria-label="Новая покупка"
      (keyup.enter)="addItem(itemInput)"
    />
    <button type="button" (click)="addItem(itemInput)">Добавить</button>
  </div>
  <ul>
    @for (item of items; track item.id) {
      <li>
        <label>
          <input type="checkbox" [checked]="item.done" (change)="toggleItem(item.id)" />
          <span [class.done]="item.done">{{ item.name }}</span>
        </label>
        <button
          class="remove-button"
          type="button"
          [attr.aria-label]="'Удалить покупку: ' + item.name"
          (click)="removeItem(item.id)"
        >
          Удалить
        </button>
      </li>
    } @empty {
      <li class="empty">Список покупок пуст</li>
    }
  </ul>
  <p class="summary">Выполнено {{ completedCount }} из {{ items.length }}</p>
</section>
