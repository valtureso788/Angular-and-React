<section class="cart-view" aria-labelledby="cart-title">
  <div class="cart-heading">
    <h3 id="cart-title">Корзина</h3>
    <button type="button" class="clear-button" [disabled]="items.length === 0" (click)="clear()">Очистить корзину</button>
  </div>
  <ul>
    @for (item of items; track item.id) {
      <li>
        <span>{{ item.name }} × {{ item.quantity }}</span>
        <span>{{ item.price * item.quantity }} ₽</span>
        <button type="button" [attr.aria-label]="'Удалить ' + item.name" (click)="removeItem(item.id)">Удалить</button>
      </li>
    } @empty {
      <li class="empty">Корзина пуста</li>
    }
  </ul>
  <p class="total">Итого: {{ total }} ₽</p>
</section>
